[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Add a verified network-scoped address in the hosting dashboard after deployment.
  VITE_PREVIEW_INDEXER_URL = "https://indexer.preview.midnight.network/api/v4/graphql"
  VITE_PREVIEW_INDEXER_WS = "wss://indexer.preview.midnight.network/api/v4/graphql/ws"
  VITE_PREPROD_INDEXER_URL = "https://indexer.preprod.midnight.network/api/v4/graphql"
  VITE_PREPROD_INDEXER_WS = "wss://indexer.preprod.midnight.network/api/v4/graphql/ws"

# Security & isolation headers required for Midnight WebAssembly & Proof Provers
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

# CORS and caching for proving keys and managed circuits
[[headers]]
  for = "/managed/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
